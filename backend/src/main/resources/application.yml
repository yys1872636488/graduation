server:
  port: 8080

spring:
  application:
    name: graduation-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/graduation_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置（JWT_SECRET 必须通过环境变量提供，至少 32 个字符）
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000  # 24 hours

# 文件上传路径
file:
  upload:
    path: ./uploads

# Python 视觉服务
vision:
  service:
    url: http://localhost:8000

# 日志
logging:
  level:
    org.example.graduation: debug